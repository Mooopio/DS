<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ML Fundamentals – Exam Prep System</title>
<style>
:root{--bg:#f7f8fa;--fg:#1b1f27;--card:#fff;--mut:#5d6675;--ac:#4f46e5;--hl:#fff3b0;--ok:#16794a;--bad:#b3261e;--bd:#e2e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#12141a;--fg:#e8eaf0;--card:#1c1f28;--mut:#a0a8b8;--ac:#8b86ff;--hl:#4a4310;--ok:#5fd39a;--bad:#ff8a80;--bd:#2c303c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{max-width:860px;margin:0 auto;padding:20px 16px 8px;display:flex;justify-content:space-between;gap:12px;align-items:center}

nav{max-width:860px;margin:0 auto;padding:6px 16px;display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;transition:.2s}
button:hover{border-color:var(--ac)}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:8px 16px 48px}
section{display:none;animation:f .35s}section.on{display:block}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
details,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0}
summary{cursor:pointer;font-weight:650;color:var(--ac)}
mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:3px}

table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}td,th{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top}th{background:var(--bg)}
code{background:var(--bg);padding:1px 6px;border-radius:5px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}

</style></head><body>
<header><h1>🧠 ML Fundamentals – Exam Prep</h1><button id="th">🌓 Theme</button></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const S={};
S.Explanation=`<p class="tip">Source lecture (Intro to Machine Learning, informal Egyptian Arabic) rebuilt as clear English. Every concept, example and warning from the lecture is kept. Tap a block to open it.</p>
<details open><summary>1. Information vs Knowledge (SQL vs ML)</summary><p>A SQL query only returns <mark>information</mark> that is already stored. Example: experience → salary. Ask “what does 1 year earn?” and the database finds the record. Ask about <b>1.5 years</b>, which is not stored, and SQL returns nothing. ML answers exactly these unseen questions. That is <mark>knowledge</mark>: something that was never in the data.</p><p><b>Analogy:</b> SQL is a librarian who fetches a book on the shelf. ML is a student who reads many books and then answers a question none of them states directly.</p></details>
<details><summary>2. Empty result vs NULL</summary><p>Querying something that does not exist returns an <mark>empty result set</mark> (a result in memory with zero rows, “no records”). It does <b>not</b> return NULL. A <mark>table</mark> is a stored database object (rows, metadata). A <mark>result</mark> is the temporary output of a query. <mark>NULL</mark> means the record <b>exists</b> but the value in that column is missing or unknown. “No record” and “record with no value” are different things.</p></details>
<details><summary>3. A model is a simulation, not reality</summary><p>Finding the pattern (each extra year adds 10, so 1.5 years gives 15) is building a <mark>model</mark>. <b>Analogy:</b> an architect’s model of a house. You cannot live in it, but it simulates the real house. A fitted line gives answers for points never seen, but it is only an approximation of the truth.</p><p>When the real points scatter above and below, the best straight line passes <i>near</i> them. At a stored point the line gives a slightly different value than the database. That difference is the <mark>error</mark>. <b>The error is the price (cost) you pay to learn</b>, just like paying for the house model. Cost buys the ability to answer unknown questions.</p><div class="tip">If the points lie perfectly on a line, the model answers stored points 100% correctly and also generalizes.</div></details>
<details><summary>4. The equations (the model is a formula)</summary><ul><li><b>Linear:</b> <code>y = w₁x + b</code>. <mark>w</mark> = weight/coefficient/slope, <mark>b</mark> = intercept. Changing w rotates the line, so predictions change.</li><li><b>Polynomial:</b> <code>y = w₁x + w₂x² + w₃x³ + w₄x⁴ …</code>. The highest power is the <mark>degree</mark>. Higher degree gives a curved line. Each term gets its own weight. Data that curves (not a sine wave) needs a higher degree.</li><li><b>Logistic (S-curve):</b> output squeezed between two limits. <b>Analogy:</b> a rheostat or circuit whose voltage runs from 0 to 5 V (or −5 to 5 V). It has an inflection point, and a threshold separates “low” from “high”.</li></ul><p><mark>Learning = choosing the best weights.</mark> A small change in a weight changes the line, which changes the prediction y. Once the equation form is chosen, ML only tunes the weights.</p><p class="tip">Turn a word problem into an equation. Then search for the best model. That is the core of the course.</p></details>
<details><summary>5. Types of problems</summary><table><tr><th>Type</th><th>Answer is…</th><th>Examples from lecture</th></tr><tr><td><b>Regression</b></td><td>Numerical and <mark>continuous</mark></td><td>Salary from experience; draw a line that represents the trend</td></tr><tr><td><b>Classification</b></td><td><mark>Discrete</mark> classes you already know</td><td>Loan yes/no; blue vs red; product rating 1, 2 or 5 stars (numbers, but discrete); good/bad</td></tr><tr><td><b>Clustering</b></td><td>Groups you <mark>do not know</mark> in advance</td><td>“I can’t tell you the classes, split these points anyway”; discover employee, business or product groups</td></tr></table><p>Classification is the easiest for a computer: choose one of a few options. Clustering is harder because there are no labels. Higher up is computer vision (find the cars in a picture). There are also other task families (e.g. optimization), beyond this lecture.</p></details>
<details><summary>6. Dimensions, features and hidden knowledge</summary><p>Each <mark>attribute/feature</mark> is a dimension. Employee described by experience only is 1D. Salary + experience is 2D. If an important attribute is missing, the data looks overlapped and unseparable. Adding a <b>third dimension</b> can reveal a plane that separates the groups. More data and more attributes give a higher chance to learn the <mark>hidden knowledge</mark>.</p><p>Beyond 3 dimensions we cannot see the data, so we cannot “eyeball” the answer. That is why we need <mark>mathematics as an abstraction level</mark>. It works the same in any dimension. Combining several attributes in a rule (if gender = male and …) also gets complicated fast, which is another reason for math.</p><div class="tip">Analogy: viewing a stadium from above you see two lines splitting it into sections. From another angle you see levels, spatial areas. Same data, new view, new separation.</div></details>
<details><summary>7. Rules-based programming vs learning</summary><p>Classic software: the programmer writes the rules. Example: a calculator. Which operations? Integer add/subtract? Decimals? Float precision (GPU uses floating point)? The business owner supplies the rules. In ML the client says: “my business is complex, I have no rules, I only have data and questions.” So we give the program data and let it <mark>generate the rules itself</mark>. It is “inverted”: you give the answers (data) and it finds the rule. A single data-science project can spread across several lectures.</p></details>
<details><summary>8. Hypothesis, evaluation and error</summary><ul><li>A <mark>hypothesis</mark> is a candidate model (a line). You need an <mark>evaluation criterion</mark> to judge if one hypothesis beats another.</li><li>Compute error at every point, sum it. Total 20 vs total 15: <b>15 is better</b>. Zero error is ideal but rarely reachable.</li><li>You also need a <mark>mechanism</mark> to change the hypothesis (not random guessing): which direction to move the line.</li><li><b>Sign of the error</b> (classification): point above the line → positive. Point below → negative. Only the sign matters for the side; magnitude says how far.</li><li>If the model disagrees with data at a point, error is large there. A linear model can be inconsistent with the data, so it may need more flexibility.</li><li>Classification example: people with high experience and low salary get no raise (below the line), others get it (above).</li><li>Electronics analogy: any voltage over a threshold counts as “1” though no true “1” exists.</li></ul></details>
<details><summary>9. Supervision (learning needs correction)</summary><p>Learning requires making a mistake first and someone <mark>correcting</mark> you. This is <mark>supervision</mark>. Two teaching styles: (a) “wrong, try again” and (b) “wrong, the right answer is X”. Both need a supervisor, like back-propagation of the error. Without feedback you cannot know if you are right. The supervisor here is the data’s true labels, used to compute the error at each step. Without labels the problem becomes unsupervised, e.g. clustering.</p></details>
<details><summary>10. Vectors: how the line is moved</summary><p>The weights of a line form a <mark>vector</mark>. A vector has <mark>magnitude</mark> (length, strength) and <mark>direction</mark>. Every point is a vector from the origin (0,0). The line’s weight vector is perpendicular to the line, so it represents it.</p><ul><li>Take the weight vector and a misclassified point vector. The <mark>angle</mark> between them tells you what to do (acute or obtuse).</li><li><b>Add</b> two vectors: result lies between them, and the line moves toward that point.</li><li><b>Subtract</b>: the line moves away.</li><li>So: angle tells if you are wrong, and add/subtract fixes it in the right direction.</li></ul><p>Next lecture: matrices and the matrix product. Review vectors from high school.</p></details>
<details><summary>11. Study advice stated in the lecture</summary><p>Ask when you hear an unknown word. One unknown word piles up, “compounded ignorance”, and the whole course becomes unclear. Do not be shy: you must make mistakes to learn.</p></details>`;
S.Summary=`<div class="card"><h2>High-yield summary</h2><ul><li><b>SQL</b> = information retrieval. <b>ML</b> = knowledge for unseen questions.</li><li>No record → <mark>empty result</mark>. NULL → record exists, value missing.</li><li><b>Model</b> = simulation. <b>Error</b> = cost of learning.</li><li>Model forms: <b>linear</b> (w,b), <b>polynomial</b> (degree), <b>logistic</b> (S, 0–1).</li><li>Learning = tune <b>weights</b> to minimize total error.</li><li><b>Regression</b> = continuous · <b>Classification</b> = known discrete classes · <b>Clustering</b> = unknown groups.</li><li><b>Features</b> = dimensions. Missing feature → hidden pattern. Over 3D → need math.</li><li>Rules-based: human writes rules. ML: rules from data.</li><li>Need: <b>hypothesis + evaluation + update mechanism</b>.</li><li>Error <b>sign</b>: above line +, below −.</li><li><b>Supervision</b> = feedback on mistakes.</li><li><b>Vector</b> = magnitude + direction. Weights = vector. <b>Angle</b> decides, <b>add/subtract</b> updates.</li></ul></div>
<div class="card"><h2>Memory optimization</h2><p><b>Mnemonic “R-C-C”:</b> <mark>R</mark>egression = <mark>R</mark>eal numbers · <mark>C</mark>lassification = <mark>C</mark>hoose a known label · <mark>C</mark>lustering = <mark>C</mark>reate unknown groups.</p><p><b>Mnemonic “H-E-U”:</b> <mark>H</mark>ypothesis → <mark>E</mark>valuate → <mark>U</mark>pdate (repeat).</p><p><b>Chunks:</b> (1) Why ML, (2) Model &amp; equations, (3) Problem types, (4) Data &amp; dimensions, (5) Learning loop &amp; vectors.</p><p><b>Spaced repetition:</b> review today, tomorrow, in 3 days, in 7 days. Cover the page and recite each chunk.</p>
<table><tr><th>Compare</th><th>A</th><th>B</th></tr><tr><td>Empty vs NULL</td><td>Empty: no record</td><td>NULL: record, no value</td></tr><tr><td>Information vs Knowledge</td><td>Stored fact</td><td>Inferred answer</td></tr><tr><td>Classification vs Clustering</td><td>Classes known</td><td>Classes unknown</td></tr><tr><td>Regression vs Classification</td><td>Continuous</td><td>Discrete</td></tr><tr><td>Add vs Subtract vectors</td><td>Move line toward point</td><td>Move away</td></tr><tr><td>Table vs Result</td><td>Stored object</td><td>Query output in memory</td></tr></table>
<div class="trap"><b>Traps:</b> “empty result” ≠ NULL · a 1–5 rating is numeric but <b>discrete</b> (classification) · model ≠ reality · lower total error is better but not always zero · “positive” is not “good”, it only means above the line · the program learns the rule, you do not code it.</div></div>`;
const Q=[
["A SQL query asks for a record that does not exist. What is returned?",["NULL","An empty result set","An error always","A guessed value"],1,"No record → empty result (in memory), not NULL."],
["NULL means:",["No record exists","Record exists, value missing","Zero","Empty table"],1,"NULL is a missing value inside an existing record."],
["Which best defines knowledge in this lecture?",["Stored rows","Answers to questions not in the data","Table metadata","Query syntax"],1,"Information is stored. Knowledge is inferred."],
["A model is best described as:",["Reality itself","A simulation of reality","A database copy","A random guess"],1,"Like a house model: useful but not real."],
["The error produced by the fitted line is:",["A bug to hide","The cost paid to learn","Always zero","Irrelevant"],1,"The error is the price of the ability to generalize."],
["With 1 year = 10 and 2 years = 20, the model gives 1.5 years =",["10","15","20","Unknown"],1,"Linear pattern: +0.5 year adds 5 → 15."],
["In y = wx + b, changing w:",["Changes slope, hence predictions","Nothing","Deletes data","Only changes x"],0,"Weights control the line’s shape."],
["The degree of a polynomial is:",["Number of points","Highest power of x","Number of weights only","Value of b"],1,"x³ term → degree 3."],
["The logistic equation is useful because its output is:",["Unbounded","An S-curve between two limits","Always linear","Negative only"],1,"It suits two-class decisions, like voltage thresholds."],
["Predicting salary (any number) is:",["Classification","Regression","Clustering","Rules-based"],1,"Continuous numeric answer."],
["Approve or reject a loan is:",["Regression","Clustering","Classification","Rendering"],2,"Known discrete classes."],
["Product ratings of 1, 2 or 5 stars are:",["Continuous","Discrete → classification","Clustering","NULL"],1,"Numbers, but a small set of discrete classes."],
["Clustering is used when:",["Classes are known","Classes are unknown","Data is empty","Answer is continuous"],1,"We ask the program to find groups."],
["Adding a third dimension can:",["Hide patterns","Reveal separation of overlapping data","Delete data","Prove model is perfect"],1,"A missing attribute can make data look inseparable."],
["Why is math essential for ML?",["It looks nice","It abstracts beyond what we can visualize (above 3D)","It replaces data","It removes error"],1,"We cannot see more than 3 dimensions."],
["Compared to rules-based programming, ML:",["Needs all rules from the owner","Generates the rules from data","Needs no data","Is always exact"],1,"Data in, rules out."],
["A point above the fitted line has error sign:",["Negative","Positive","Zero","Undefined"],1,"Above = positive, below = negative."],
["Total error 20 for line A, 15 for line B. Better choice?",["A","B","Equal","Neither is usable"],1,"Lower error is better, though not necessarily perfect."],
["Why must the update step have a mechanism?",["Random changes are optimal","We need to know which direction to move the line","To increase error","To delete labels"],1,"Guessing blindly is inefficient."],
["Supervision means:",["No feedback","Someone corrects mistakes","Only clustering","Memorizing"],1,"You must err first and then be corrected."],
["A vector has:",["Only magnitude","Magnitude and direction","Only direction","No origin"],1,"A length plus an orientation from the origin."],
["The weights of the line are treated as a:",["Vector","Table","Query","Label"],0,"The weight vector represents the line."],
["The angle between weight vector and point vector is used to:",["Draw colours","Decide whether to add or subtract","Count rows","Remove NULLs"],1,"It signals a mistake and the direction of fix."],
["Adding the point vector to the weight vector:",["Moves the line toward the point","Moves it away","Deletes it","Does nothing"],0,"Subtraction does the opposite."]];
S.Questions=`<div class="card"><b>MCQs</b> · Score: <span id="score">0/0</span> <span class="lv">(first 8 easy · next 8 medium · rest harder)</span></div><div id="mq"></div>
<h2>Written questions</h2>
${[["Short: Differentiate between an empty result and NULL.","An empty result means the query matched no record, and it is a result in memory with zero rows. NULL means a record exists but a particular column has no value. They describe different situations."],
["Short: Why is the error called the “cost of learning”?","A model approximates reality, so its prediction at known points differs slightly from the true values. We accept this difference to gain the ability to answer unseen questions, like paying for a house model."],
["Short: Define regression, classification and clustering.","Regression: predict a continuous number. Classification: choose from known discrete classes. Clustering: group data when the classes are not known."],
["Long: Explain the difference between rules-based programming and machine learning, using the lecture’s examples.","In rules-based programming (e.g. a calculator) the owner states the rules: integer or decimal operations, float precision. The programmer encodes them. In ML, the client has complex business data but no rules. We feed the data and the program generates the rules. Example: experience → salary, where the model learns the pattern, not the formula we wrote. The advantage is answering questions that no rule anticipated, at the cost of some error."],
["Long: Describe how a linear classifier is evaluated and corrected.","Hypothesis: a line with weights. Evaluation: for each point, error sign (above = positive, below = negative) and total error. Mistakes are found via supervision, i.e. the true labels. Correction: the weight vector and the misclassified point are vectors with an angle. Depending on the angle, add the vectors (line moves toward the point) or subtract them (away). Repeat until total error is minimal."],
["Long: Why do dimensions and features matter, and why do we need math?","Each attribute is a dimension. Missing attributes hide patterns, and adding a dimension (e.g. a third) can reveal a plane separating the classes. More data raises the chance to learn hidden knowledge. Above 3D we cannot visualize, and combining attributes in manual rules becomes unmanageable, so mathematical abstraction is needed."]].map(([q,a])=>`<details><summary>${q}</summary><p><b>Model answer:</b> ${a}</p></details>`).join("")}`;
S.Revision=`<div class="card"><h2>⚡ One-page / night-before sheet</h2><ul><li><b>Info</b> = stored · <b>Knowledge</b> = inferred.</li><li><b>Empty result ≠ NULL.</b></li><li><b>Model</b> = simulation · <b>error</b> = cost of learning.</li><li><code>y = w₁x + b</code> · polynomial: <code>w₁x + w₂x² + …</code> · logistic = S-curve.</li><li>Learning = <mark>tune weights</mark> to minimize total error.</li><li><b>Regression</b>: continuous · <b>Classification</b>: known discrete · <b>Clustering</b>: unknown.</li><li>Features = dimensions; missing one hides patterns; &gt;3D needs math.</li><li>Need: hypothesis, evaluation, update mechanism.</li><li>Above line = +, below = −.</li><li>Supervision = corrected mistakes.</li><li>Vector = magnitude + direction · angle → decide · add = toward, subtract = away.</li><li>Next topic: matrices and matrix product.</li></ul><div class="trap">Ratings 1–5 = discrete. Positive ≠ good. Lower total error ≠ zero error. If a word is unclear, ask.</div></div>`;
const nav=document.getElementById("nav"),m=document.getElementById("m");
Object.keys(S).forEach((k,i)=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>go(k);b.id="b"+k;nav.append(b);const s=document.createElement("section");s.id="s"+k;s.innerHTML=S[k];m.append(s)});
function go(k){Object.keys(S).forEach(x=>{document.getElementById("s"+x).classList.toggle("on",x==k);document.getElementById("b"+x).classList.toggle("on",x==k)});scrollTo({top:0,behavior:"smooth"})}
let right=0,done=0;const mq=document.getElementById("mq");
Q.forEach((q,i)=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<b>${i+1}. ${q[0]}</b><span class="lv"> ${i<8?"Easy":i<16?"Medium":"Hard"}</span>`;let ans=false;
q[1].forEach((o,j)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>{if(ans)return;ans=true;done++;if(j==q[2])right++;b.classList.add(j==q[2]?"ok":"no");d.querySelectorAll(".opt")[q[2]].classList.add("ok");ex.classList.add("show");document.getElementById("score").textContent=right+"/"+done};d.append(b)});
const ex=document.createElement("div");ex.className="ex";ex.textContent="Explanation: "+q[3];const t=document.createElement("button");t.textContent="Show/hide answer";t.onclick=()=>{d.querySelectorAll(".opt")[q[2]].classList.toggle("ok");ex.classList.toggle("show")};d.append(t,ex);mq.append(d)});
document.getElementById("th").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
go("Explanation");
</script></body></html>
